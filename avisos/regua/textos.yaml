# Textos da régua pós-compra (13/10/2026). Mudou aqui, muda o e-mail: o layout
# fica em blocos.py e não precisa ser tocado para ajustar copy.
#
# Variáveis entre chaves são preenchidas com o pedido:
#   {nome} primeiro nome da cliente      {pedido} número com #, ex. #1160
#   {peca} nome curto da peça principal  {peca_nome} nome da peça com a cor
#   {data_postagem} ex. "qui, 15/10"     {data_entrega} ex. "até 16/10"
#   {hora_limite} hora em que o Pix expira, ex. "14h32"
#   {servico} PAC ou SEDEX               {dias_producao} ex. 10
#   {previsao_correios} data prevista dos Correios, ex. "qui, 15/10"
#   Gênero da peça principal: {Seu}/{seu} (Seu/Sua), {o_seu} (o seu/a sua),
#   {ele} (ele/ela), {feito} (feito/feita), {postado} (postado/postada)
#
# Regras (blueprint): você, frases curtas, sem emoji, sem travessão, sem
# exclamação em sequência, datas no calendário, sem oferta.
# "previa" é o texto cinza que a caixa de entrada mostra ao lado do assunto.
#
# Pedido com mais de uma peça: onde existir a mesma chave terminada em _plural,
# ela é usada no lugar ("suas peças", Pedro 13/10). Pedido misto (pronta + sob
# encomenda) usa as chaves terminadas em _misto, quando existirem.

geral:
  whatsapp: "554384557263"
  whatsapp_mensagem: "Oi, é sobre o pedido {pedido}"
  frase_whats: "Dúvidas? Responda este e-mail ou fale com a gente."
  rodape: "Responda este e-mail se precisar de algo. A gente lê todos."
  # Rodapé: cada item vira link. {whatsapp} é o link da conversa já com o pedido.
  rodape_links:
    - ["WhatsApp +55 43 8455-7263", "{whatsapp}"]
    - ["Instagram", "https://www.instagram.com/annis____/"]
    - ["annis.store", "https://annis.store"]
  empresa: "CIRINO E PAGNAN LTDA · CNPJ 58.859.303/0001-44"

e0:
  assunto: "Recebemos seu pedido {pedido}"
  previa: "Assim que o pagamento for confirmado, você recebe as datas."
  faixa: "Pedido {pedido} · recebido"
  eyebrow: "Pedido {pedido}"
  titulo: "Recebemos seu pedido"
  texto:
    - "Oi, {nome}. Seu pedido chegou até a gente. Assim que o pagamento for confirmado, você recebe outro e-mail com a data de postagem e a previsão de entrega."
  # Pagamento já aprovado na criação do pedido (cartão): o 2 chega logo em seguida.
  previa_pago: "Pagamento aprovado. As datas chegam no próximo e-mail."
  texto_pago:
    - "Oi, {nome}. Recebemos seu pedido e seu pagamento já foi aprovado. Em seguida chega outro e-mail com a data de postagem e a previsão de entrega."
  resumo: "Seu pedido"

