# E-mails de divulgação do Novembro Annis (campanha/divulgacao.py, 30/10/2026).
# Vão para quem já comprou e para quem tem cadastro sem compra. {nome} é o
# primeiro nome, ou vazio quando o cadastro não tem: por isso "Oi{virgula_nome}".
# "aprovado: true" libera o envio; sem isso o script não manda e avisa no grupo.
# "banner": endereço da arte na Shopify (Conteúdo > Arquivos). Sem banner, o
# e-mail abre com a foto da campanha e o título por cima.
divulgacao:
  # Arte da home (YLWT5445 + título) com "Até 40% off + 10% de volta", 1200x800, 31/10.
