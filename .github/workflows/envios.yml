# PDF do dia para imprimir: etiquetas (4 por folha) e notas na mesma ordem,
# com os pedidos pagos até as 12h que ainda não foram impressos.
#
# Sem agendamento aqui (o do GitHub atrasa horas): quem dispara é o Supabase,
# às 12h05 de Brasília, de segunda a sexta (avisos.sql). O script pula
# feriado nacional sozinho.
name: Envios do dia

on:
  workflow_dispatch:
    inputs:
      agora:
        description: "Gerar mesmo fora de dia útil (teste)"
        required: false
        default: "nao"

concurrency:
  group: envios
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar
        run: |
          pip install --quiet requests sqlalchemy psycopg2-binary playwright pypdf
          playwright install --with-deps chromium

      - name: Montar e mandar o PDF
        env:
          OLIST_TOKEN: ${{ secrets.OLIST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL_BANCO: ${{ secrets.SUPABASE_URL_BANCO }}
          SHOPIFY_LOJA: ${{ secrets.SHOPIFY_LOJA }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          CORREIOS_USUARIO: ${{ secrets.CORREIOS_USUARIO }}
          CORREIOS_CODIGO_ACESSO: ${{ secrets.CORREIOS_CODIGO_ACESSO }}
          CORREIOS_CARTAO: ${{ secrets.CORREIOS_CARTAO }}
          CORREIOS_AMBIENTE: ${{ vars.CORREIOS_AMBIENTE }}
        run: python avisos/envios.py ${{ inputs.agora == 'sim' && '--agora' || '' }}
