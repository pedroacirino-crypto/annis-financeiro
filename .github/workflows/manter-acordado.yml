# Rotina diária do painel: atualiza os dados e mantém tudo acordado.
#
# Três coisas dormem ou envelhecem, e cada uma precisa de um cutucão:
#
#   - Os dados. Sem isto, o painel só atualiza quando alguém clica. Em agosto
#     12 vendas ficaram 20 dias fora da tela, três delas de fim de semana.
#   - O app. A Streamlit Community hiberna depois de 12 horas sem visita,
#     e a rotina precisa saber acordá-lo, não só visitá-lo.
#   - O banco. A documentação do Supabase diz que o plano gratuito "pode pausar
#     aplicações que apresentem baixa atividade num período de 7 dias".
#
# Roda todo dia, inclusive sábado e domingo, que é quando a loja também vende.
name: Rotina diaria

on:
  schedule:
    # Três toques por dia porque a Streamlit Community hiberna o app depois de
    # 12 horas sem visita, e o agendador do GitHub costuma atrasar de 3 a 4
    # horas no plano gratuito: no dia 19/09 a rotina das 11h só rodou às 14h,
    # com o app já dormindo. Horários em UTC, Brasília é 3 horas a menos.
    - cron: "0 9 * * *"    # 6h
    - cron: "0 15 * * *"   # 12h
    - cron: "0 21 * * *"   # 18h
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar o navegador
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Atualizar os dados
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: python rotina/atualizar.py

      - name: Cutucar o banco
        env:
          PGCONN: ${{ secrets.SUPABASE_URL_BANCO }}
        run: |
          psql "$PGCONN" -tAc "select count(*) from pedidos_historicos" \
            | sed 's/^/pedidos guardados: /'
